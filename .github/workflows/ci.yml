name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ariadne
          POSTGRES_PASSWORD: ariadne_ci
          POSTGRES_DB: ariadne_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ariadne"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://ariadne:ariadne_ci@localhost:5432/ariadne_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything-real
          BETTER_AUTH_URL: http://localhost:3000
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder